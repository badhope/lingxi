[project]
name = "data-agent"
version = "0.1.0"
description = "FastAPI + CrewAI multi-agent data assistant"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "badhope"}
]
keywords = ["ai", "agent", "llm", "fastapi", "crewai"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7", "mypy>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = false
