name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.3
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install
        run: |
          cd dataagent
          pip install -r requirements.txt
      - name: Import smoke test
        run: |
          cd dataagent
          python -c "import main; print('main imports OK')"
          python -c "import cli; print('cli imports OK')"
          python -c "import core; print('core imports OK')"
          python -c "import routers; print('routers imports OK')"
          python -c "import services; print('services imports OK')"
